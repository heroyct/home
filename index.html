<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<meta name="robots" content="noindex,nofollow">
<title>美好家园</title>
<style>
  
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1f2733;--sub:#6b7585;--line:#e7eaef;--she:#e11d74;--he:#4f46e5;--talk:#10b981;
    --o:#4a8ba8;--f:#c96442;--n:#8a6bb0;--r:#6b9e5f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif}

  
  .hero{position:relative;overflow:hidden;color:#fff;padding:46px 24px 96px;
    background:linear-gradient(120deg,#fbbf24,#f97316 40%,#fb7185 75%,#f472b6);background-size:220% 220%;animation:sky 16s ease-in-out infinite}
  @keyframes sky{50%{background-position:100% 50%}}
  .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.45;mix-blend-mode:soft-light}
  .b1{width:320px;height:320px;background:#fff7ed;right:-60px;top:-120px;animation:drift 14s ease-in-out infinite}
  .b2{width:240px;height:240px;background:#fde68a;left:-80px;bottom:-110px;animation:drift 11s ease-in-out infinite reverse}
  @keyframes drift{50%{transform:translate(-30px,24px) scale(1.12)}}
  .float{position:absolute;bottom:-30px;font-size:22px;opacity:0;animation:rise linear infinite;pointer-events:none}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-330px) rotate(25deg);opacity:0}}
  .hin{position:relative;max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:22px}
  .house{flex:none;width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:grid;place-items:center;box-shadow:0 12px 30px -12px rgba(124,45,18,.55);animation:bob 4s ease-in-out infinite}
  .house svg{width:62px;height:62px}
  .house .ht{transform-origin:16px 19px;animation:beat 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
  .hi-t{font-size:14px;font-weight:700;opacity:.95;letter-spacing:.04em}
  .hero h1{margin:2px 0 6px;font-size:34px;line-height:1.2;letter-spacing:.06em;text-shadow:0 2px 14px rgba(124,45,18,.25)}
  .day{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:99px}

  .wrap{position:relative;max-width:1000px;margin:-62px auto 0;padding:0 24px 60px}
  section{background:var(--card);border-radius:20px;padding:20px 24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 18px 40px -30px rgba(249,115,22,.45)}
  section h2{font-size:18px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .hi{flex:none;width:32px;height:32px;border-radius:10px;background:#fff1e6;display:inline-flex;align-items:center;justify-content:center;font-size:16px}

  
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .grid.one{grid-template-columns:1fr}
  a.tile{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
  a.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,var(--cs) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s ease}
  a.tile > *{position:relative}
  @media (hover:hover){
    a.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px var(--c);border-color:var(--c)}
    a.tile:hover::before{transform:translateX(100%)}
    a.tile:hover .ico{transform:scale(1.12) rotate(-6deg)}
    a.tile:hover .ar{transform:translateX(4px);color:var(--c)}
  }
  a.tile:active{transform:scale(.98)}
  .tile .ico{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:var(--cs);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  
  .tile .ico svg{width:44px;height:44px}
  .tile .nm{font-weight:700;font-size:16px;color:var(--c)}
  .tile .ds{font-size:12.5px;color:var(--sub)}
  .tile .ar{margin-left:auto;color:#c3c8d0;font-size:22px;transition:transform .25s,color .25s}
  .she{--c:var(--she);--cs:#fde7f1} .he{--c:var(--he);--cs:#eceafd} .talk{--c:var(--talk);--cs:#e3f6ee} .trip{--c:#0ea5e9;--cs:#e0f2fe} .sleep{--c:#8b5cf6;--cs:#f1ecfe}

  
  .formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.9;
    transition:transform .2s ease,box-shadow .2s ease}
  @media (hover:hover){.formula:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,39,51,.09)}}
  .formula .fs{white-space:nowrap;border-radius:10px;padding:0 6px 0 0;animation:lit 8s ease-in-out infinite}
  .formula .fs:nth-of-type(2){animation-delay:2s}.formula .fs:nth-of-type(3){animation-delay:4s}.formula .fs:nth-of-type(4){animation-delay:6s}
  @keyframes lit{0%,25%,100%{background:transparent}6%,19%{background:#fff4e6}}
  .formula .to{color:#fdba74}
  .step{display:inline-block;min-width:44px;text-align:center;font-size:12px;font-weight:700;color:#fff;border-radius:10px;padding:1px 8px;margin-right:8px}
  .o{background:var(--o)} .f{background:var(--f)} .n{background:var(--n)} .r{background:var(--r)}
  .formula b{flex-basis:100%;margin-top:2px;font-size:14px}

  
  @keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .hin > *{animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}.hin > :nth-child(2){animation-delay:.12s}
  .wrap > section{animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}.wrap > section:nth-child(1){animation-delay:.2s}.wrap > section:nth-child(2){animation-delay:.32s}.wrap > section:nth-child(3){animation-delay:.44s}.wrap > section:nth-child(4){animation-delay:.56s}
  .grid a.tile{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.35s + var(--i,0) * .08s)}

  @media (max-width:720px){
    .hero{padding:30px 16px 84px}.hin{gap:16px}.house{width:72px;height:72px;border-radius:22px}.house svg{width:48px;height:48px}
    .hero h1{font-size:28px}.wrap{padding:0 16px 50px}section{padding:16px 14px}
    .formula .to{display:none}.formula .fs{flex-basis:100%}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='fga' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fbbf24'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23fga)'/%3E%3Cpath d='M16 5.5 4.8 15h3.4v10.5h15.6V15h3.4Z' fill='%23fff'/%3E%3Cpath d='M16 22.2c-.3-.3-3.6-2.6-3.6-4.8a1.9 1.9 0 0 1 3.6-.9 1.9 1.9 0 0 1 3.6.9c0 2.2-3.3 4.5-3.6 4.8Z' fill='%23fb7185'/%3E%3C/svg%3E">
<style>
.fam-bar{background:rgba(255,255,255,.94);border-bottom:1px solid #e7eaef;position:relative;z-index:60}
.fam-in{max-width:1300px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:36px;min-height:64px}
.fam-brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#f97316;text-decoration:none;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.fam-brand svg{display:block;width:32px;height:32px;flex:none}
.fam-nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.fam-nav::-webkit-scrollbar{display:none}
.fam-nav a{display:inline-flex;align-items:center;height:34px;padding:0 15px;border-radius:99px;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.fam-nav a.she{background:#fde7f1;color:#e11d74}.fam-nav a.she:hover,.fam-nav a.she.on{background:#e11d74;color:#fff}
.fam-nav a.he{background:#eceafd;color:#4f46e5}.fam-nav a.he:hover,.fam-nav a.he.on{background:#4f46e5;color:#fff}
.fam-nav a.talk{background:#e3f6ee;color:#10b981}.fam-nav a.talk:hover,.fam-nav a.talk.on{background:#10b981;color:#fff}
.fam-nav a.trip{background:#e0f2fe;color:#0284c7}.fam-nav a.trip:hover,.fam-nav a.trip.on{background:#0ea5e9;color:#fff}
.fam-bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.fam-bc a{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);color:#6b7585;font-size:12.5px;font-weight:600;text-decoration:none}
.fam-bc a.cur{background:var(--bcs);color:var(--bc);box-shadow:none}
.fam-bc .sep{color:#c3c8d0;font-size:14px}
.fam-nav a svg{width:22px;height:22px;margin-right:4px;flex:none}.fam-bc a svg{width:18px;height:18px;margin-right:4px;flex:none}
.fam-bc + h1{margin-top:0!important}
@media (max-width:720px){.fam-in{gap:14px;padding:0 16px}}
@media (max-width:420px){.fam-brand span{display:none}.fam-nav a{padding:0 11px}}
</style>
</head>
<body>
<div class="fam-bar"><div class="fam-in"><a class="fam-brand" href="./"><svg viewBox="0 0 32 32"><defs><linearGradient id="fga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#fga)"/><path d="M16 5.5 4.8 15h3.4v10.5h15.6V15h3.4Z" fill="#fff"/><path d="M16 22.2c-.3-.3-3.6-2.6-3.6-4.8a1.9 1.9 0 0 1 3.6-.9 1.9 1.9 0 0 1 3.6.9c0 2.2-3.3 4.5-3.6 4.8Z" fill="#fb7185"/></svg><span>美好家园</span></a><nav class="fam-nav"><a class="she" href="wife/"><svg viewBox="0 0 44 44"><path d="M8 26c0-10 6-17 14-17s14 7 14 17v12H8Z" fill="#1f1a17"/><circle cx="22" cy="23" r="11" fill="#fbe0c8"/><path d="M11 21c1-7 6-11 11-11s10 4 11 11c-4-1-8-4-10-7-2 4-7 6-12 7Z" fill="#1f1a17"/><circle cx="18" cy="24" r="1.3" fill="#3b2a20"/><circle cx="26" cy="24" r="1.3" fill="#3b2a20"/><ellipse cx="15.5" cy="27.5" rx="2" ry="1.2" fill="#f9a8c0" opacity=".8"/><ellipse cx="28.5" cy="27.5" rx="2" ry="1.2" fill="#f9a8c0" opacity=".8"/><path d="M19.5 28.5q2.5 2.2 5 0" stroke="#c2410c" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>老婆</a><a class="he" href="husband/"><svg viewBox="0 0 44 44"><circle cx="22" cy="24" r="11.5" fill="#fbe0c8"/><path d="M10.5 22c0-8 5-12.5 11.5-12.5S33.5 14 33.5 22c-2-3-5-5-8-5.5-3 2-9 3.5-15 5.5Z" fill="#1f1a17"/><circle cx="18" cy="25" r="1.3" fill="#3b2a20"/><circle cx="26" cy="25" r="1.3" fill="#3b2a20"/><path d="M15.5 21.5h4M24.5 21.5h4" stroke="#1f1a17" stroke-width="1.3" stroke-linecap="round"/><path d="M19.5 29q2.5 2.2 5 0" stroke="#c2410c" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>老公</a><a class="talk" href="talk/">🕊 沟通</a><a class="trip" href="trip/">🚃 出行</a></nav></div></div>
<header class="hero">
  <span class="blob b1"></span><span class="blob b2"></span>
  <div class="hin">
    <div class="house"><svg viewBox="0 0 32 32"><path d="M16 5.5 4.8 15h3.4v10.5h15.6V15h3.4Z" fill="#fff"/><path class="ht" d="M16 22.2c-.3-.3-3.6-2.6-3.6-4.8a1.9 1.9 0 0 1 3.6-.9 1.9 1.9 0 0 1 3.6.9c0 2.2-3.3 4.5-3.6 4.8Z" fill="#fb7185"/></svg></div>
    <div>
      <div class="hi-t" id="hello">你好</div>
      <h1>美好家园</h1>
      <span class="day" id="day"></span>
    </div>
  </div>
</header>
<main class="wrap">
  <section>
    <h2><span class="hi">🧹</span>家务育儿</h2>
    <div class="grid">
      <a class="tile she" href="wife/" style="--i:0"><span class="ico"><svg viewBox="0 0 44 44"><path d="M8 26c0-10 6-17 14-17s14 7 14 17v12H8Z" fill="#1f1a17"/><circle cx="22" cy="23" r="11" fill="#fbe0c8"/><path d="M11 21c1-7 6-11 11-11s10 4 11 11c-4-1-8-4-10-7-2 4-7 6-12 7Z" fill="#1f1a17"/><circle cx="18" cy="24" r="1.3" fill="#3b2a20"/><circle cx="26" cy="24" r="1.3" fill="#3b2a20"/><ellipse cx="15.5" cy="27.5" rx="2" ry="1.2" fill="#f9a8c0" opacity=".8"/><ellipse cx="28.5" cy="27.5" rx="2" ry="1.2" fill="#f9a8c0" opacity=".8"/><path d="M19.5 28.5q2.5 2.2 5 0" stroke="#c2410c" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></span><span><span class="nm">老婆</span><br><span class="ds">我负责的家务育儿</span></span><span class="ar">›</span></a>
      <a class="tile he" href="husband/" style="--i:1"><span class="ico"><svg viewBox="0 0 44 44"><circle cx="22" cy="24" r="11.5" fill="#fbe0c8"/><path d="M10.5 22c0-8 5-12.5 11.5-12.5S33.5 14 33.5 22c-2-3-5-5-8-5.5-3 2-9 3.5-15 5.5Z" fill="#1f1a17"/><circle cx="18" cy="25" r="1.3" fill="#3b2a20"/><circle cx="26" cy="25" r="1.3" fill="#3b2a20"/><path d="M15.5 21.5h4M24.5 21.5h4" stroke="#1f1a17" stroke-width="1.3" stroke-linecap="round"/><path d="M19.5 29q2.5 2.2 5 0" stroke="#c2410c" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></span><span><span class="nm">老公</span><br><span class="ds">我负责的家务育儿</span></span><span class="ar">›</span></a>
    </div>
  </section>

  <section>
    <h2><span class="hi">🚃</span>一起出去玩</h2>
    <div class="grid one">
      <a class="tile trip" href="trip/" style="--i:2"><span class="ico">🚃</span><span><span class="nm">最近的出行</span><br><span class="ds">未来 1 个月去哪儿 · 当天的流程・带什么・花多少</span></span><span class="ar">›</span></a>
    </div>
  </section>

  <section>
    <h2><span class="hi">🕊</span>好好说话</h2>
    <div class="grid one">
      <a class="tile talk" href="talk/" style="--i:3"><span class="ico">🕊</span><span><span class="nm">非暴力沟通 练习卡</span><br><span class="ds">想发火的时候，先翻这一页 · 7 个家里的例子</span></span><span class="ar">›</span></a>
    </div>
    <div class="formula">
      <span class="fs"><span class="step o">观察</span>当我看到 / 听到 ……</span><span class="to">→</span>
      <span class="fs"><span class="step f">感受</span>我觉得 ……</span><span class="to">→</span>
      <span class="fs"><span class="step n">需要</span>因为我需要 / 我在乎 ……</span><span class="to">→</span>
      <span class="fs"><span class="step r">请求</span>你愿不愿意 ……？</span>
      <b>说「我」，不说「你怎么样」。</b>
    </div>
  </section>

  <section>
    <h2><span class="hi">📌</span>其他</h2>
    <div class="grid one">
      <a class="tile sleep" href="sleep/" style="--i:4"><span class="ico">🕰</span><span><span class="nm">东京人几点起床・几点睡</span><br><span class="ds">东京圈平日的作息分布 · 和我们家比一比</span></span><span class="ar">›</span></a>
    </div>
  </section>
</main>
<script>
// 按时间打招呼・今天星期几（平日 / 周末和家务清单里的分法一样）
(function(){
  var d=new Date(),h=d.getHours(),w=d.getDay();
  var hi=h<5?'夜深了，早点休息 🌙':h<11?'早上好 ☀️':h<14?'中午好 🍱':h<18?'下午好 🌤':h<22?'晚上好 🌆':'夜深了，早点休息 🌙';
  var we=(w===0||w===6);
  document.getElementById('hello').textContent=hi+' · '+(we?'一起出去玩吧 🎈':'今天也辛苦了 💛');
  document.getElementById('day').textContent=(d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 星期'+'日一二三四五六'[w]+' · '+(we?'周末':'平日');
  // 欢迎区里慢慢飘起来的小东西
  var em=['💛','🏡','🌸','⭐','🎈','🧸'],hero=document.querySelector('.hero');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    for(var i=0;i<9;i++){var s=document.createElement('span');s.className='float';s.textContent=em[i%em.length];
      s.style.left=(6+i*11)+'%';s.style.animationDuration=(9+(i%4)*2)+'s';s.style.animationDelay=(i*1.3)+'s';s.style.fontSize=(16+(i%3)*5)+'px';hero.appendChild(s)}
  }
})();
// 本地（file://）打开时，文件夹链接不会自动找 index.html，补上。GitHub Pages 上不变
if(location.protocol==='file:'){[].forEach.call(document.querySelectorAll('a[href$="/"]'),function(a){a.setAttribute('href',a.getAttribute('href')+'index.html')})}
</script>
</body>
</html>
