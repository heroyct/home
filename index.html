<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<meta name="robots" content="noindex,nofollow">
<title>美好家园</title>
<style>
  :root{--bg:#faf7ff;--card:#fff;--ink:#22172e;--sub:#7d6b8f;--line:#eadff7;--she:#e11d74;--he:#4f46e5;--both:#8b5cf6}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f1c;--card:#1f1729;--ink:#f3eafd;--sub:#b3a2c6;--line:#33264a;--she:#f472b6;--he:#818cf8;--both:#a78bfa}}
  :root[data-theme="dark"]{--bg:#140f1c;--card:#1f1729;--ink:#f3eafd;--sub:#b3a2c6;--line:#33264a;--she:#f472b6;--he:#818cf8;--both:#a78bfa}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
  .hero{position:relative;overflow:hidden;color:#fff;padding:44px 16px 70px;text-align:center;
    background:linear-gradient(135deg,var(--he) 0%,var(--both) 50%,var(--she) 100%)}
  .hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#fff;opacity:.18;right:-80px;top:-90px;animation:f 9s ease-in-out infinite}
  @keyframes f{50%{transform:translateY(16px) scale(1.06)}}
  .hero h1{margin:0;font-size:32px;letter-spacing:.04em}
  .wrap{max-width:520px;margin:-40px auto 0;padding:0 16px 40px;position:relative;display:grid;gap:14px}
  a.pick{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 34px -22px rgba(139,92,246,.8);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;-webkit-tap-highlight-color:transparent}
  a.pick:active{transform:scale(.98)}
  @media (hover:hover){a.pick:hover{transform:translateY(-4px)}}
  .em{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:36px}
  .she .em{background:rgba(225,29,116,.10)} .he .em{background:rgba(79,70,229,.10)}
  .t{font-size:20px;font-weight:800} .she .t{color:var(--she)} .he .t{color:var(--he)}
  .m{font-size:13px;color:var(--sub)}
  .arrow{margin-left:auto;font-size:22px;color:var(--sub)}
  a.pick.soon{pointer-events:none;opacity:.5;box-shadow:none}
  @keyframes inL{0%{opacity:0;transform:translateX(-60px)}70%{opacity:1;transform:translateX(6px)}100%{transform:none}}
  @keyframes inR{0%{opacity:0;transform:translateX(60px)}70%{opacity:1;transform:translateX(-6px)}100%{transform:none}}
  a.pick.she{animation:inL .7s .15s cubic-bezier(.2,.8,.2,1) backwards}
  a.pick.he{animation:inR .7s .3s cubic-bezier(.2,.8,.2,1) backwards}
  body{overflow-x:hidden}
  @media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero"><h1>美好家园</h1></header>
<main class="wrap">
  <a class="pick she" href="wife/"><span class="em">👩</span><div><div class="t">老婆</div></div><span class="arrow">›</span></a>
  <a class="pick he" href="husband/"><span class="em">👨</span><div><div class="t">老公</div></div><span class="arrow">›</span></a>
</main>
<script>
// 本地（file://）打开时，文件夹链接不会自动找 index.html，补上。GitHub Pages 上不变
if(location.protocol==='file:'){[].forEach.call(document.querySelectorAll('a.pick'),function(a){var h=a.getAttribute('href');if(/\/$/.test(h))a.setAttribute('href',h+'index.html')})}
</script>
</body>
</html>
